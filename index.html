<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language Cards</title>
    <meta
      name="description"
      content="A small, accessible language-learning playground. Pick a language to start."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="soft" data-view="landing">
    <main class="landing">
      <header class="landing-head">
        <h1 class="landing-title">Language Cards</h1>
        <p class="landing-sub">
          Pick a language to see its lessons. Each lesson pairs a
          source language with a target translation and highlights
          word-level alignments.
        </p>
      </header>
      <section
        class="landing-list"
        data-landing-list
        aria-label="Available languages"
      ></section>
    </main>

    <!--
      Each language folder has a lessons-data/ folder with one
      JS file per lesson. To add a new language, drop a folder
      named <Language>/ with its own lessons-data/<id>.js files
      and add a <script> tag below pointing to the language's
      manifest.

      To add a lesson to an existing language, drop the JS file
      in that language's lessons-data/ folder and add a <script>
      tag inside that language's index.html.

      To keep this landing in sync without editing this file for
      every new language, the landing auto-discovers lessons by
      reading every language's index.html. Each language page
      registers its lessons via window.LC_LESSONS.
    -->
    <script src="Turkish/lessons-data/yapmak-etmek.js"></script>
    <script src="app.js"></script>
    <script>
      // Group registered lessons by language and render them as
      // language cards that link to each language's landing page.
      (function () {
        var container = document.querySelector('[data-landing-list]');
        if (!container || !Array.isArray(window.LC_LESSONS)) return;
        var groups = {};
        window.LC_LESSONS.forEach(function (lesson) {
          var lang = lesson.language || 'Other';
          if (!groups[lang]) groups[lang] = [];
          groups[lang].push(lesson);
        });
        Object.keys(groups).sort().forEach(function (lang) {
          var section = document.createElement('section');
          section.className = 'lang-group';
          var h2 = document.createElement('h2');
          h2.className = 'lang-group-title';
          h2.textContent = lang;
          section.appendChild(h2);
          var grid = document.createElement('div');
          grid.className = 'lang-grid';
          var a = document.createElement('a');
          a.className = 'lesson-card';
          // Language landing page lives at /<Language>/index.html.
          var slug = lang.toLowerCase();
          a.href = slug + '/';
          var t = document.createElement('span');
          t.className = 'lesson-card-title';
          t.textContent = lang + ' · ' + groups[lang].length +
            (groups[lang].length === 1 ? ' lesson' : ' lessons');
          a.appendChild(t);
          var sum = document.createElement('p');
          sum.className = 'lesson-card-summary';
          sum.textContent = groups[lang]
            .map(function (l) { return l.title || l.id; })
            .join(' · ');
          a.appendChild(sum);
          grid.appendChild(a);
          section.appendChild(grid);
          container.appendChild(section);
        });
      })();
    </script>
  </body>
</html>
