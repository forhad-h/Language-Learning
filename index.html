<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language Cards</title>
    <meta
      name="description"
      content="A small, accessible language-learning playground. Lessons live under each language's folder and register themselves."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="soft">
    <a class="skip" href="#card-region">Skip to card</a>

    <!-- Landing page: shown when the URL has no hash. Lists every
         language and its lessons as deep-link cards. Hidden when a
         hash route is active. -->
    <main class="landing" data-landing hidden>
      <header class="landing-head">
        <h1 class="landing-title">Language Cards</h1>
        <p class="landing-sub">
          Pick a lesson to start. Each lesson pairs a source language
          with a target translation and highlights word-level alignments.
        </p>
      </header>
      <section class="landing-list" data-landing-list aria-label="Available lessons"></section>
    </main>

    <!-- Lesson view: shown when a hash route like
         #/turkish/yapmak-etmek is active. Hidden on the landing
         page. -->
    <main class="app-main" data-app-main hidden>
      <a class="home-link" href="./" data-home-link>← All lessons</a>
      <aside class="app-sidebar" aria-label="Lessons">
        <ul class="lesson-list" data-lesson-list></ul>
      </aside>

      <section
        id="card-region"
        class="card-region"
        aria-live="polite"
        aria-labelledby="card-region-title"
      >
        <h2 id="card-region-title" class="visually-hidden">Lesson cards</h2>
        <div class="card-stack" data-card-stack></div>
      </section>
    </main>

    <!--
      Floating, bottom-center toolbar with display controls. The
      font-size slider and plain-text checkbox moved out of the
      sidebar. The lesson selector is visible only on mobile (CSS).
    -->
    <div
      class="toolbar"
      data-toolbar
      role="toolbar"
      aria-label="Display controls"
    >
      <label class="size-control" title="Adjust card text size">
        <span class="size-label">Text</span>
        <input
          id="font-size"
          type="range"
          min="18"
          max="32"
          step="1"
          value="22"
          aria-label="Card text size"
        />
        <output class="size-value" for="font-size" aria-hidden="true">22px</output>
      </label>

      <label class="check-control" title="Show sentences as plain text without any mark color">
        <input
          id="plain-text"
          type="checkbox"
          aria-label="Show sentences as plain text without any mark color"
        />
        <span class="check-label">Plain text</span>
      </label>

      <label class="lesson-select-control" title="Switch lesson">
        <span class="size-label">Lesson</span>
        <select
          id="lesson-select"
          class="lesson-select"
          data-lesson-select
          aria-label="Switch lesson"
        ></select>
      </label>
    </div>

    <!--
      Lessons self-register via window.LC_LESSONS.push(). To add a
      new lesson, drop a file under <Language>/lessons/ and add a
      matching <script> tag below. Order matters — first script is
      the default lesson.

      Folder layout:
        Turkish/lessons/yapmak-etmek.js
        Spanish/lessons/...   (future)
        Bengali/lessons/...   (future)
    -->
    <script src="Turkish/lessons/yapmak-etmek.js"></script>
    <script src="app.js"></script>
  </body>
</html>
